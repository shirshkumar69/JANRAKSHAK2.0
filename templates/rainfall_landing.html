<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JANRAKSHAK | SatCom Rainfall Telemetry Radar</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --brand-cyan: #ffaa00;
            --brand-blue: #ffc800;
            --brand-red: #ff3344;
            --bg-dark: #0a0907;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            perspective: 1000px;
        }

        #rain-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; pointer-events: none;
        }

        #three-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2; opacity: 0.85; pointer-events: none;
            mix-blend-mode: screen;
        }

        .radar-grid {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 3; pointer-events: none;
            background-image: radial-gradient(rgba(0, 242, 254, 0.08) 1px, transparent 1px);
            background-size: 24px 24px;
            opacity: 0.5;
        }

        .radar-sweep {
            position: absolute;
            top: 50%; left: 50%;
            width: 800px; height: 800px;
            margin-top: -400px; margin-left: -400px;
            border-radius: 50%;
            border: 1px solid rgba(0, 242, 254, 0.15);
            pointer-events: none;
            z-index: 4;
            box-shadow: 0 0 50px rgba(0, 242, 254, 0.05);
        }

        .radar-sweep::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%;
            background: conic-gradient(from 0deg, rgba(0, 242, 254, 0.3) 0deg, transparent 60deg, transparent 360deg);
            animation: radarRotate 8s linear infinite;
        }

        @keyframes radarRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .scanline {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, transparent 50%, rgba(0, 242, 254, 0.04) 51%);
            background-size: 100% 4px; pointer-events: none; z-index: 12;
        }

        .corner {
            position: absolute; width: 50px; height: 50px; z-index: 15;
            border: 2px solid var(--brand-cyan); opacity: 0.6;
        }
        .corner-tl { top: 40px; left: 40px; border-right: none; border-bottom: none; }
        .corner-tr { top: 40px; right: 40px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: 40px; left: 40px; border-right: none; border-top: none; }
        .corner-br { bottom: 40px; right: 40px; border-left: none; border-top: none; }

        .hud-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: radial-gradient(circle at center, transparent 0%, rgba(2,4,10,0.92) 100%);
        }

        .center-console {
            background: rgba(6, 12, 24, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-top: 3px solid var(--brand-cyan);
            padding: 50px 70px;
            border-radius: 12px;
            text-align: center;
            position: relative;
            box-shadow: 0 30px 60px rgba(0,0,0,0.9), 0 0 40px rgba(0, 242, 254, 0.15);
            max-width: 650px;
            width: 90%;
            animation: consoleFade 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes consoleFade {
            from { opacity: 0; transform: translateY(-40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .eyebrow-badge {
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            color: var(--brand-cyan);
            letter-spacing: 4px;
            margin-bottom: 20px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .eyebrow-badge::before, .eyebrow-badge::after {
            content: ''; display: block; width: 30px; height: 1px; background: rgba(0, 242, 254, 0.4);
        }

        .main-title {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: 4px;
            margin: 0 0 15px 0;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 0 0 25px rgba(0, 242, 254, 0.6);
        }

        .main-title span {
            color: var(--brand-cyan);
        }

        .sub-copy {
            color: #9cb0c5;
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 35px;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .actions-group {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .action-btn {
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.15), rgba(79, 172, 254, 0.15));
            border: 1px solid var(--brand-cyan);
            color: #ffffff;
            padding: 16px 36px;
            font-size: 13px;
            font-family: 'DM Mono', monospace;
            font-weight: 700;
            letter-spacing: 2px;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.2);
        }

        .action-btn:hover {
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.35), rgba(79, 172, 254, 0.35));
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.6);
            transform: translateY(-2px);
        }

        .action-btn.secondary {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
            color: #a0b2c6;
            box-shadow: none;
        }

        .action-btn.secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.4);
        }

        .metrics-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 35px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 25px;
        }

        .metric-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }

        .metric-card small {
            display: block;
            font-family: 'DM Mono', monospace;
            font-size: 9px;
            color: #6b7f96;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .metric-card strong {
            font-family: 'DM Mono', monospace;
            font-size: 18px;
            color: var(--brand-cyan);
        }
    </style>
</head>
<body>

    <canvas id="rain-canvas"></canvas>
    <div id="three-canvas"></div>

    <div class="radar-grid"></div>
    <div class="radar-sweep"></div>
    <div class="scanline"></div>

    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <div class="hud-overlay">
        <div class="center-console">
            <div class="eyebrow-badge">
                <span>● SATELLITE TELEMETRY UPLINK</span>
            </div>

            <h1 class="main-title">RAINFALL <span>RADAR</span></h1>
            <p class="sub-copy">Real-time SatCom precipitation pulse tracking, storm cell vectoring, and subsurface Green-Ampt pore water pressure coupling for NH-07 Uttarakhand.</p>

            <div class="actions-group">
                <button class="action-btn" id="radarConsoleBtn">📡 Open Live Doppler Radar →</button>
                <button class="action-btn secondary" id="soundBtn">⚡ Downpour Audio</button>
                <button class="action-btn secondary" id="controlRoomBtn">Command Center ↗</button>
            </div>

            <div class="metrics-bar">
                <div class="metric-card">
                    <small>PRECIPITATION</small>
                    <strong id="m-rain">42.5 mm/h</strong>
                </div>
                <div class="metric-card">
                    <small>PORE PRESSURE (u)</small>
                    <strong id="m-pore">0.82 ratio</strong>
                </div>
                <div class="metric-card">
                    <small>WIND SPEED</small>
                    <strong id="m-wind">34 km/h</strong>
                </div>
            </div>
        </div>
    </div>

    <script>
        const rainCanvas = document.getElementById('rain-canvas');
        const ctx = rainCanvas.getContext('2d');

        function resizeRainCanvas() {
            rainCanvas.width = window.innerWidth;
            rainCanvas.height = window.innerHeight;
        }
        resizeRainCanvas();
        window.addEventListener('resize', resizeRainCanvas);

        const drops = [];
        const dropCount = 700;

        for (let i = 0; i < dropCount; i++) {
            drops.push({
                x: Math.random() * rainCanvas.width,
                y: Math.random() * rainCanvas.height,
                length: Math.random() * 25 + 15,
                speed: Math.random() * 22 + 18,
                opacity: Math.random() * 0.6 + 0.3,
                wind: Math.random() * 3 + 2
            });
        }

        let flashOpacity = 0;

        function drawRain() {
            ctx.clearRect(0, 0, rainCanvas.width, rainCanvas.height);

            if (Math.random() < 0.008) {
                flashOpacity = 0.25;
            }
            if (flashOpacity > 0) {
                ctx.fillStyle = `rgba(0, 242, 254, ${flashOpacity})`;
                ctx.fillRect(0, 0, rainCanvas.width, rainCanvas.height);
                flashOpacity -= 0.02;
            }

            ctx.lineWidth = 1.2;
            ctx.lineCap = 'round';

            for (let i = 0; i < dropCount; i++) {
                const d = drops[i];

                ctx.strokeStyle = `rgba(0, 242, 254, ${d.opacity})`;
                ctx.beginPath();
                ctx.moveTo(d.x, d.y);
                ctx.lineTo(d.x - d.wind * 2, d.y + d.length);
                ctx.stroke();

                d.y += d.speed;
                d.x -= d.wind;

                if (d.y > rainCanvas.height) {
                    d.y = -d.length;
                    d.x = Math.random() * (rainCanvas.width + 200);
                }
            }

            requestAnimationFrame(drawRain);
        }
        drawRain();

        let scene, camera, renderer, rainParticles;

        function init3DRain() {
            const container = document.getElementById('three-canvas');
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.z = 200;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            const pGeo = new THREE.BufferGeometry();
            const pCount = 1500;
            const pos = new Float32Array(pCount * 3);

            for (let i = 0; i < pCount; i++) {
                pos[i*3] = (Math.random() - 0.5) * 600;
                pos[i*3+1] = (Math.random() - 0.5) * 600;
                pos[i*3+2] = (Math.random() - 0.5) * 600;
            }

            pGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

            const pMat = new THREE.PointsMaterial({
                color: 0x00f2fe,
                size: 1.5,
                transparent: true,
                opacity: 0.6
            });

            rainParticles = new THREE.Points(pGeo, pMat);
            scene.add(rainParticles);

            function animate3D() {
                requestAnimationFrame(animate3D);

                const positions = rainParticles.geometry.attributes.position.array;
                for (let i = 0; i < pCount; i++) {
                    positions[i*3+1] -= 8;
                    if (positions[i*3+1] < -300) {
                        positions[i*3+1] = 300;
                    }
                }
                rainParticles.geometry.attributes.position.needsUpdate = true;

                renderer.render(scene, camera);
            }
            animate3D();
        }
        init3DRain();

        let audioCtx, isPlayingSound = false;

        function playStormSound() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            const bufferSize = audioCtx.sampleRate * 5;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);

            let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
            for (let i = 0; i < bufferSize; i++) {
                const white = Math.random() * 2 - 1;
                b0 = 0.99886 * b0 + white * 0.0555179;
                b1 = 0.99332 * b1 + white * 0.0750759;
                b2 = 0.96900 * b2 + white * 0.1538520;
                b3 = 0.86650 * b3 + white * 0.3104856;
                b4 = 0.55000 * b4 + white * 0.5329522;
                b5 = -0.7616 * b5 - white * 0.0168980;
                data[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
                data[i] *= 0.11;
                b6 = white * 0.115926;
            }

            const noiseSource = audioCtx.createBufferSource();
            noiseSource.buffer = buffer;
            noiseSource.loop = true;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 1200;

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.8, audioCtx.currentTime + 1.5);

            noiseSource.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            noiseSource.start();
        }

        document.getElementById('soundBtn').addEventListener('click', () => {
            if (!isPlayingSound) {
                playStormSound();
                isPlayingSound = true;
                document.getElementById('soundBtn').textContent = '🌧️ Sound Active (Click to Mute)';
                document.getElementById('soundBtn').style.borderColor = '#2ed573';
                document.getElementById('soundBtn').style.color = '#2ed573';
            } else {
                if (audioCtx) audioCtx.close();
                isPlayingSound = false;
                document.getElementById('soundBtn').textContent = '⚡ Activate Downpour Sound';
                document.getElementById('soundBtn').style.borderColor = 'var(--brand-cyan)';
                document.getElementById('soundBtn').style.color = '#ffffff';
            }
        });

        document.getElementById('radarConsoleBtn').addEventListener('click', () => {
            window.location.href = "/rainfall";
        });

        document.getElementById('controlRoomBtn').addEventListener('click', () => {
            window.location.href = "/dashboard";
        });

        // Live Telemetry Sync
        async function loadLiveTelemetry() {
            try {
                const res = await fetch('/api/weather/global?city=Devprayag');
                if (res.ok) {
                    const data = await res.json();
                    const rain = Number(data.rain_rate_mm_h ?? 0.0);
                    const wind = Number(data.wind_speed_kmh ?? 12.0);
                    const accum = Number(data.rainfall_24h_mm ?? data.accum_24h_mm ?? 0.0);
                    const poreRatio = Math.min(1.0, 0.15 + (accum / 150.0));

                    const rainEl = document.getElementById('m-rain');
                    if (rainEl) rainEl.textContent = `${rain.toFixed(1)} mm/h`;

                    const poreEl = document.getElementById('m-pore');
                    if (poreEl) poreEl.textContent = `${poreRatio.toFixed(2)} ratio`;

                    const windEl = document.getElementById('m-wind');
                    if (windEl) windEl.textContent = `${wind.toFixed(0)} km/h`;
                }
            } catch (e) {
                console.log("Telemetry sync fallback active");
            }
        }
        loadLiveTelemetry();
    </script>
</body>
</html>
