<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JANRAKSHAK | Tactical Boot Sequence</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --brand-cyan: #ffaa00;
            --brand-red: #ff3344;
            --bg-dark: #0a0907;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            perspective: 1000px;
        }

        /* 1. Ethereal Highway Background behind the 3D Mesh */
        .bg-image {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://images.unsplash.com/photo-1517604323605-6a56e098bd83?q=80&w=2560&auto=format&fit=crop'); /* Atmospheric mountain road */
            background-size: cover;
            background-position: center 80%;
            opacity: 0.35;
            z-index: 0;
            filter: grayscale(1) sepia(0.4) hue-rotate(180deg) brightness(0.5) contrast(1.3);
            transition: transform 6s cubic-bezier(0.16, 1, 0.3, 1), opacity 3s;
        }

        .bg-image.plunge {
            transform: scale(2.5) translateY(-10%); /* Dramatic zoom in */
            filter: grayscale(1) sepia(0.4) hue-rotate(180deg) brightness(0.1) contrast(2);
            opacity: 0;
        }

        /* 2. Tactical Dot Grid Overlay */
        .dot-grid {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; pointer-events: none;
            background-image: radial-gradient(rgba(0, 242, 254, 0.1) 1px, transparent 1px);
            background-size: 20px 20px;
            opacity: 0.4;
        }

        #canvas-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2; opacity: 1;
            transition: opacity 1.5s ease-in;
            mix-blend-mode: screen; /* Blends the 3D wireframe over the photo beautifully */
        }

        /* Ambient glowing vignette */
        .hud-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: radial-gradient(circle at center, transparent 0%, rgba(3,5,10,0.9) 100%);
            pointer-events: none;
        }

        .scanline {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, transparent 50%, rgba(0, 242, 254, 0.05) 51%);
            background-size: 100% 4px; pointer-events: none; z-index: 12;
        }

        /* Corner accents */
        .corner {
            position: absolute; width: 50px; height: 50px; z-index: 15;
            border: 2px solid var(--brand-cyan); opacity: 0.6;
        }
        .corner-tl { top: 40px; left: 40px; border-right: none; border-bottom: none; }
        .corner-tr { top: 40px; right: 40px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: 40px; left: 40px; border-right: none; border-top: none; }
        .corner-br { bottom: 40px; right: 40px; border-left: none; border-top: none; }

        /* The Main UI Console */
        .center-console {
            background: rgba(6, 9, 20, 0.5);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-top: 3px solid var(--brand-red); /* Aggressive styling */
            padding: 60px 80px;
            border-radius: 6px;
            text-align: center;
            pointer-events: auto;
            position: relative;
            box-shadow: 0 30px 60px rgba(0,0,0,0.9), inset 0 0 30px rgba(0,242,254,0.05);

            /* The Entrance Animation */
            opacity: 0;
            transform: translateY(-80px) scale(0.9) rotateX(15deg);
            animation: consoleDropIn 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            animation-delay: 0.2s;
        }

        @keyframes consoleDropIn {
            0% { opacity: 0; transform: translateY(-80px) scale(0.9) rotateX(15deg); filter: blur(10px); }
            100% { opacity: 1; transform: translateY(0) scale(1) rotateX(0deg); filter: blur(0); }
        }

        /* The Rock Fall Disintegration Animation */
        .center-console.falling {
            /* Text shatters and plummets matching the rocks */
            animation: consoleShatter 1.5s cubic-bezier(0.65, 0, 0.1, 1) forwards !important;
        }

        @keyframes consoleShatter {
            0% { transform: translateY(0) rotateZ(0deg) rotateX(0deg); opacity: 1; filter: blur(0); }
            15% { transform: translateY(-30px) rotateZ(-3deg) rotateX(-10deg) scale(1.05); opacity: 1; box-shadow: 0 0 100px rgba(153, 0, 17, 0.6); border-color: var(--brand-red); }
            100% { transform: translateY(150vh) rotateZ(25deg) rotateX(60deg) scale(0.5); opacity: 0; filter: blur(15px); }
        }

        .brand-logo {
            font-family: 'DM Mono', monospace;
            font-size: 15px; color: var(--brand-cyan); letter-spacing: 5px; margin-bottom: 25px;
            display: flex; align-items: center; justify-content: center; gap: 12px;
        }
        .brand-logo::before, .brand-logo::after {
            content: ''; display: block; width: 40px; height: 1px; background: rgba(0,242,254,0.5);
        }

        /* Glitch text block */
        .brand-title {
            font-size: 5rem; margin: 0 0 15px 0; font-weight: 800;
            letter-spacing: 8px; text-transform: uppercase;
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.5);
            position: relative;
            display: inline-block;
        }
        .brand-title span { color: var(--brand-red); text-shadow: 0 0 20px rgba(153, 0, 17, 0.5); }

        .brand-title:hover {
            animation: glitch 0.2s infinite;
        }

        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-3px, 2px) }
            40% { transform: translate(-3px, -2px) }
            60% { transform: translate(3px, 2px) }
            80% { transform: translate(3px, -2px) }
            100% { transform: translate(0) }
        }

        .brand-subtitle {
            font-family: 'DM Mono', monospace; color: #a9b9c9; font-size: 14px;
            letter-spacing: 4px; margin: 0 0 45px 0; text-transform: uppercase;
        }

        .start-btn {
            background: rgba(0, 242, 254, 0.05); border: 1px solid var(--brand-cyan);
            color: var(--brand-cyan); padding: 20px 50px; font-size: 15px;
            font-family: 'DM Mono', monospace; font-weight: 600; letter-spacing: 3px;
            cursor: pointer; text-transform: uppercase;
            position: relative; overflow: hidden;
            transition: all 0.3s;
            box-shadow: inset 0 0 15px rgba(0, 242, 254, 0.1);
        }
        .start-btn::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--brand-cyan); z-index: -1; transform: scaleX(0);
            transform-origin: right; transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .start-btn:hover { color: var(--bg-dark); box-shadow: 0 0 30px rgba(0, 242, 254, 0.6); }
        .start-btn:hover::before { transform: scaleX(1); transform-origin: left; }

        /* HUD Loading Elements */
        .boot-sequence {
            position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 600px; display: none; flex-direction: column;
            pointer-events: none; z-index: 20;
        }
        .boot-status {
            font-family: 'DM Mono', monospace; font-size: 13px; color: var(--brand-cyan);
            margin-bottom: 12px; display: flex; justify-content: space-between;
            font-weight: bold; text-shadow: 0 0 10px var(--brand-cyan);
        }
        .progress-track {
            width: 100%; height: 3px; background: rgba(255,255,255,0.1); position: relative;
        }
        .progress-bar {
            width: 0%; height: 100%; background: var(--brand-red);
            box-shadow: 0 0 15px var(--brand-red), 0 0 30px var(--brand-red);
            transition: width 0.1s;
        }

        #terminal-log {
            position: absolute; left: 50px; bottom: 90px; width: 350px;
            font-family: 'DM Mono', monospace; font-size: 12px; color: rgba(0, 242, 254, 0.6);
            pointer-events: none; display: none; line-height: 1.6; z-index: 20;
            text-shadow: 0 0 5px rgba(0,242,254,0.3);
        }
        #terminal-log div { animation: typeLine 0.15s forwards; }

        @keyframes typeLine { from { opacity: 0; transform: translateX(-15px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body>

    <!-- Atmospheric Photo Background -->
    <div class="bg-image" id="highway-bg"></div>
    <div class="dot-grid"></div>

    <!-- 3D Mesh Engine -->
    <div id="canvas-container"></div>
    <div class="scanline"></div>

    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <div class="hud-overlay" id="overlay">
        <div class="center-console" id="main-console">
            <div class="brand-logo">NH-07 SURVEILLANCE CORRIDOR</div>
            <h1 class="brand-title" title="Hover for glitch">JAN<span>RAKSHAK</span></h1>
            <p class="brand-subtitle">AI-Driven Mountain Geohazard Radar</p>
            <button class="start-btn" id="startBtn">Initialize Uplink</button>
        </div>

        <div class="boot-sequence" id="boot-ui">
            <div class="boot-status">
                <span id="boot-text">ESTABLISHING SATELLITE HANDSHAKE...</span>
                <span id="boot-pct">0%</span>
            </div>
            <div class="progress-track">
                <div class="progress-bar" id="boot-bar"></div>
            </div>
        </div>

        <div id="terminal-log"></div>
    </div>

    <script>
        // --- 1. Procedural 3D Terrain Background ---
        let scene, camera, renderer, terrain, particles;
        const clock = new THREE.Clock();

        // Sim State
        let isBooting = false;
        let cameraTargetZ = 80;
        let cameraTargetY = 35;
        let simSpeed = 0.5;

        function init3D() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x060913, 0.015);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 50, 100); // Start higher up
            camera.lookAt(0, 0, 0);

            // Transparent renderer allows the HTML DOM background image to show through!
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x060913, 0.1); // Extremely low alpha to reveal highway
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Lighting
            const ambient = new THREE.AmbientLight(0x0a1420, 2.5);
            scene.add(ambient);
            const directional = new THREE.DirectionalLight(0x00f2fe, 1.0);
            directional.position.set(50, 100, 50);
            scene.add(directional);
            const dangerLight = new THREE.PointLight(0xff4757, 0, 250); // Red alert during fall
            dangerLight.position.set(0, 30, -20);
            scene.add(dangerLight);
            window.dangerLight = dangerLight;

            // Endless Mountain Mesh (Wireframe + Semi-transparent Solid)
            const geometry = new THREE.PlaneGeometry(350, 350, 90, 90);
            geometry.rotateX(-Math.PI / 2);

            const posAttribute = geometry.attributes.position;
            const vertexCount = posAttribute.count;

            for (let i = 0; i < vertexCount; i++) {
                const x = posAttribute.getX(i);
                const z = posAttribute.getZ(i);

                let y = Math.sin(x * 0.05) * Math.cos(z * 0.05) * 25;
                y += Math.sin(x * 0.1) * Math.cos(z * 0.1) * 12;
                // Carve a deep highway valley down the Z-axis (x=0)
                const distFromCenter = Math.abs(x);
                if (distFromCenter < 30) {
                    y -= (30 - distFromCenter) * 1.8;
                }
                // Jaggedness
                y += (Math.random() - 0.5) * 3;
                posAttribute.setY(i, y);
            }
            geometry.computeVertexNormals();

            // Duo-material: translucent dark blue solid with bright cyan wireframe
            const matDark = new THREE.MeshPhongMaterial({
                color: 0x030610,
                shininess: 90,
                transparent: true,
                opacity: 0.65, // Let's us see the photo thru the mountains
                flatShading: true
            });
            const matWire = new THREE.MeshBasicMaterial({
                color: 0x00a8ff,
                wireframe: true,
                transparent: true,
                opacity: 0.25
            });

            terrain = new THREE.Mesh(geometry, matDark);
            const wireframe = new THREE.Mesh(geometry, matWire);
            terrain.add(wireframe);
            terrain.position.y = -10;
            scene.add(terrain);

            // Landslide / Debris Particles (Hidden at start)
            const pGeo = new THREE.BufferGeometry();
            const pCount = 3000; // Increased rock count!
            const pPos = new Float32Array(pCount * 3);
            const pVel = [];

            for(let i=0; i<pCount; i++) {
                pPos[i*3] = (Math.random() - 0.5) * 120;
                pPos[i*3+1] = Math.random() * 100 + 40;
                pPos[i*3+2] = (Math.random() - 0.5) * 120 - 40;

                pVel.push({
                    x: (Math.random() - 0.5) * 15,
                    y: -(Math.random() * 30 + 30), // Faster gravitational fall
                    z: Math.random() * 20 // Tumble directly towards the camera
                });
            }
            pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
            window.pVel = pVel;

            const pMat = new THREE.PointsMaterial({
                color: 0xa9b9c9, size: 0.8, transparent: true, opacity: 0
            });
            particles = new THREE.Points(pGeo, pMat);
            scene.add(particles);

            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();

            // Scrolling terrain
            terrain.position.z += 18 * dt * simSpeed;
            if (terrain.position.z > 40) {
                terrain.position.z = 0;
            }

            // If booting sequence triggered
            if (isBooting) {
                // Violent Camera swoop down into the valley, matching rocks falling
                camera.position.z += (cameraTargetZ - camera.position.z) * 1.5 * dt;
                camera.position.y += (cameraTargetY - camera.position.y) * 2.5 * dt;

                // Intense Camera shaking (earthquake effect)
                camera.position.x = (Math.random() - 0.5) * 1.8;
                camera.position.y += (Math.random() - 0.5) * 1.2;

                // Animate debris particles falling
                particles.material.opacity = Math.min(particles.material.opacity + dt*2, 1.0);
                const pos = particles.geometry.attributes.position.array;

                for(let i = 0; i < pos.length / 3; i++) {
                    pos[i*3] += window.pVel[i].x * dt;
                    pos[i*3+1] += window.pVel[i].y * dt;
                    pos[i*3+2] += window.pVel[i].z * dt;

                    // Reloop particles back to the top
                    if (pos[i*3+1] < -15) {
                        pos[i*3+1] = Math.random() * 60 + 50;
                        pos[i*3+2] = camera.position.z - (Math.random() * 150);
                    }
                }
                particles.geometry.attributes.position.needsUpdate = true;
            } else {
                // Idle camera gentle cinematic drift
                camera.position.x = Math.sin(clock.elapsedTime * 0.3) * 12;
            }

            camera.lookAt(0, 0, terrain.position.z - 40);
            renderer.render(scene, camera);
        }

        // --- 2. Synthetic Audio Engine ---
        let audioCtx;
        function playBootSound() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const bSize = audioCtx.sampleRate * 6;
            const buffer = audioCtx.createBuffer(1, bSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);

            // Immense deep brown-noise rumble
            let lastOut = 0;
            for (let i = 0; i < bSize; i++) {
                const white = Math.random() * 2 - 1;
                data[i] = (lastOut + (0.02 * white)) / 1.02;
                lastOut = data[i];
                data[i] *= 4.5; // High gain
            }

            const noiseSrc = audioCtx.createBufferSource();
            noiseSrc.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(40, audioCtx.currentTime);
            filter.frequency.exponentialRampToValueAtTime(1500, audioCtx.currentTime + 2.5); // Open up roar
            filter.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 5); // Muffe out

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(3.5, audioCtx.currentTime + 2); // Very loud
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 5);

            // Sci-fi klaxon synth pulse
            const osc = audioCtx.createOscillator();
            osc.type = 'square';
            osc.frequency.setValueAtTime(80, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 2);

            const oscGain = audioCtx.createGain();
            oscGain.gain.setValueAtTime(0, audioCtx.currentTime);
            oscGain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.5);
            oscGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 3);

            const bq = audioCtx.createBiquadFilter();
            bq.type = 'lowpass';
            bq.frequency.value = 1000;

            noiseSrc.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            osc.connect(bq);
            bq.connect(oscGain);
            oscGain.connect(audioCtx.destination);

            noiseSrc.start();
            osc.start();
        }

        // --- 3. Interaction Logic ---
        document.getElementById('startBtn').addEventListener('click', () => {
            // TRIGGER THE FALLING UI ANIMATION (Shatters and plummets matching rocks)
            const consoleBox = document.getElementById('main-console');
            consoleBox.classList.add('falling'); // Assigns the plummet CSS animation

            // Plunge the photographic background forward
            document.getElementById('highway-bg').classList.add('plunge');

            // Show HUD tracking UI
            const bootUi = document.getElementById('boot-ui');
            const termUi = document.getElementById('terminal-log');
            bootUi.style.display = 'flex';
            termUi.style.display = 'block';

            // Ignite 3D landslide physics
            isBooting = true;
            simSpeed = 4.0; // Warp speed terrain
            cameraTargetZ = 15; // Dive dangerously close
            cameraTargetY = -5;  // Drop violently into the trench
            window.dangerLight.intensity = 3.5; // Turn everything warning red

            // Execute Sound Synthesis
            playBootSound();

            // Progress Logic
            const bar = document.getElementById('boot-bar');
            const pct = document.getElementById('boot-pct');
            const txt = document.getElementById('boot-text');

            const steps = [
                { p: 10, text: "LINKING GEOSPATIAL SATCOM..." },
                { p: 30, text: "ROUTING SRTM 30m DEM TOPOGRAPHY..." },
                { p: 50, text: "INJECTING PORE WATER PRESSURE DYNAMICS..." },
                { p: 75, text: "IGNITING KINEMATIC PHYSICS ENGINE..." },
                { p: 95, text: "CRITICAL: LANDSLIDE EVENT DETECTED" },
                { p: 100, text: "ESTABLISHING EMERGENCY UI..." }
            ];

            const terms = [
                "sys.dmesg > /dev/srtm", "allocating memory array [32k mesh]...",
                "resolving infinite-slope mechanics", "applying gradient transforms...",
                "connection est: 30.1N 78.5E", "WARN: FOV threshold broken",
                "bypass auth -> routing telemetry..."
            ];

            let progress = 0;
            let termIdx = 0;

            // Stream terminal output
            const tInterval = setInterval(() => {
                if(termIdx < terms.length) {
                    const el = document.createElement('div');
                    el.innerText = terms[termIdx++];
                    termUi.appendChild(el);
                }
            }, 400);

            // Progress bar tick
            const pInterval = setInterval(() => {
                progress += (Math.random() * 2 + 0.5); // Random increments
                if (progress >= 100) progress = 100;

                bar.style.width = progress + '%';
                pct.innerText = Math.floor(progress) + '%';

                const step = steps.slice().reverse().find(s => progress >= s.p);
                if (step) txt.innerText = step.text;

                if (progress === 100) {
                    clearInterval(pInterval);
                    clearInterval(tInterval);
                    // Fade everything to black instantly
                    document.getElementById('canvas-container').style.opacity = '0';
                    document.getElementById('highway-bg').style.opacity = '0';
                    setTimeout(() => {
                        window.location.href = "/dashboard";
                    }, 500);
                }
            }, 40); // Boot sequence ≈ 4.5 seconds
        });

        // Initialize WebGL
        init3D();
    </script>
</body>
</html>
